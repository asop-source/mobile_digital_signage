name: signage
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.0.0
  webview_flutter_android: ^4.10.0
  url_launcher: ^6.3.2 # Tambahkan ini
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.2
  wakelock_plus: ^1.2.10
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_windows: ^0.6.0
  responsive_ui: ^3.0.1
  msix: ^3.16.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/img.webp

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

msix_config:
  display_name: Digital Signage
  publisher_display_name: Multi Kencana Niagatama
  identity_name: com.signage.signage
  msix_version: 1.0.2.0
  logo_path: assets/images/img.webp
  capabilities: internetClient
  install_certificate: false
