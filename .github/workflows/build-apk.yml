name: Build APK and Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build release Windows app
        run: flutter build windows --release
        env:
          # permission_handler_windows still includes the deprecated
          # <experimental/coroutine> header, which newer MSVC treats as
          # a hard error unless explicitly silenced.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Zip Windows build
        run: |
          # Every plugin also gets its own per-config "Release" build directory,
          # so filter down to the one actually nested under "runner" - that's
          # the folder with the app exe and its bundled assets/DLLs.
          $release = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.Parent.Name -eq 'runner' } |
            Select-Object -First 1
          if (-not $release) {
            throw "Could not find windows/*/runner/Release build output directory"
          }
          Compress-Archive -Path "$($release.FullName)/*" -DestinationPath signage-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows
          path: signage-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: app-release-windows
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            dist/app-release.apk
            dist/signage-windows.zip
